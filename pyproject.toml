[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-core"
version = "0.1.0"
requires-python = ">=3.12"

[project.optional-dependencies]
stream = ["numpy>=2.0,<3", "opencv-python-headless>=4.10,<5", "torch>=2.5,<3", "torchvision>=0.20,<1"]

[project.scripts]
vision-stream = "vision.stream_replay:main"
vision-live = "vision.stream_live:main"
vision-camera-bridge = "vision.camera_gateway:main"

[tool.setuptools.packages.find]
include = ["vision*"]
